name: Deploy Linco Backend (Docker & K8s)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            yazan420/linco-backend-app:latest
            yazan420/linco-backend-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to MicroK8s via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            microk8s kubectl rollout restart deployment backend-deployment

            microk8s kubectl rollout status deployment backend-deployment --timeout=180s

            BACKEND_POD=$(microk8s kubectl get pods -l app=backend -o jsonpath="{.items[0].metadata.name}")

            microk8s kubectl exec -i $BACKEND_POD -- npx prisma migrate deploy
