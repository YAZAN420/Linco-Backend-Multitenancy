name: Deploy Linco Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Check Secret Length and Lines
        run: |
          echo "=== فحص طول المتغير ==="
          echo -n "${{ secrets.SSH_PRIVATE_KEY }}" | wc -c
          echo "=== فحص عدد الأسطر ==="
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | wc -l

      - name: Copy Files to DigitalOcean
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'dist/,package.json,package-lock.json'
          target: '~/server'

      - name: Restart Application via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/server

            npm install --omit=dev

            pm2 restart all --update-env || pm2 start dist/main.js --name "linco-backend"
