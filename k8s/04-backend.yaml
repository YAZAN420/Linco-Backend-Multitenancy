apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: run-migrations
          image: yazan420/linco-backend-app:latest
          imagePullPolicy: Always
          command: ['sh', '-c', 'npx prisma migrate deploy']
          envFrom:
            - secretRef:
                name: app-secrets
      containers:
        - name: backend
          image: yazan420/linco-backend-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: '500m'
              memory: '350Mi'
            limits:
              memory: '1Gi'
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 3000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prisma-studio-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prisma-studio
  template:
    metadata:
      labels:
        app: prisma-studio
    spec:
      containers:
        - name: prisma-studio
          image: yazan420/linco-backend-app:latest
          imagePullPolicy: Always
          command: ['sh', '-c', 'npx prisma studio --port 5555 --browser none']
          ports:
            - containerPort: 5555
          envFrom:
            - secretRef:
                name: app-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: prisma-service
spec:
  type: ClusterIP
  selector:
    app: prisma-studio
  ports:
    - port: 5555
      targetPort: 5555
